name: nightly-long-fuzz

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ridstore-nightly-long-fuzz
  cancel-in-progress: false

jobs:
  long-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Go from go.mod
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run every format fuzz target for 30 minutes
        shell: bash
        run: |
          make test-fuzz-long \
            FUZZ_LONG_TIME=30m \
            FUZZ_REPORT_DIR="${RUNNER_TEMP}/long-fuzz-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Upload raw report and discovered corpus
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: long-fuzz-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/long-fuzz-*
          if-no-files-found: error
          retention-days: 30
